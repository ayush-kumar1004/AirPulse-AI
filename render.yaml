services:
  # 1. Backend API (FastAPI on Native Python)
  - type: web
    name: airpulse-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CITY
        value: Delhi
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Web Application (React + Vite SPA)
  - type: web
    name: airpulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: airpulse-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
