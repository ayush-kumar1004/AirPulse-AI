# docker-compose — postgres+postgis, redis, backend, frontend. Owner: Person A (infra).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: airintel_db
    environment:
      POSTGRES_USER: airintel
      POSTGRES_PASSWORD: airintel
      POSTGRES_DB: airintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: airintel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: airintel_backend
    env_file:
      - ./backend/.env
    environment:
      # override host values so containers talk to each other by service name
      DATABASE_URL: postgresql://airintel:airintel@db:5432/airintel
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: airintel_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
